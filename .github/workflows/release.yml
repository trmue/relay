name: Release Python Package

env:
  DEFAULT_PYTHON_VERSIONS: "3.9 3.10 3.11 3.12 3.13 3.14"

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ matrix.platform.interpreter || env.DEFAULT_PYTHON_VERSIONS }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ matrix.platform.interpreter || env.DEFAULT_PYTHON_VERSIONS}}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
            interpreter: "3.11 3.12 3.13 3.14"
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
            interpreter: "3.12 3.13 3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ matrix.platform.interpreter || env.DEFAULT_PYTHON_VERSIONS}}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
            interpreter: "3.10 3.11 3.12 3.13 3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ matrix.platform.interpreter || env.DEFAULT_PYTHON_VERSIONS}}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v5
        with:
          name: wheels-sdist
          path: dist

  # Test the artifacts: each wheel on its own platform, with the oldest and newest Python it is
  # built for, and the sdist. The stim tests need stim, pymatching and ldpc, which have no
  # wheels for aarch64 Linux and Windows on ARM, so those wheels run the other tests only.
  test:
    name: Test ${{ matrix.platform.artifact }} (Python ${{ matrix.platform.python }})
    needs: [linux, windows, macos, sdist]
    runs-on: ${{ matrix.platform.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {runner: ubuntu-22.04, artifact: wheels-linux-x86_64, python: "3.9", stim: true}
          - {runner: ubuntu-22.04, artifact: wheels-linux-x86_64, python: "3.14", stim: true}
          - {runner: ubuntu-22.04-arm, artifact: wheels-linux-aarch64, python: "3.9", stim: false}
          - {runner: ubuntu-22.04-arm, artifact: wheels-linux-aarch64, python: "3.14", stim: false}
          - {runner: windows-latest, artifact: wheels-windows-x64, python: "3.11", stim: true}
          - {runner: windows-latest, artifact: wheels-windows-x64, python: "3.14", stim: true}
          - {runner: windows-11-arm, artifact: wheels-windows-aarch64, python: "3.12", stim: false}
          - {runner: windows-11-arm, artifact: wheels-windows-aarch64, python: "3.14", stim: false}
          - {runner: macos-15-intel, artifact: wheels-macos-x86_64, python: "3.9", stim: true}
          - {runner: macos-15-intel, artifact: wheels-macos-x86_64, python: "3.14", stim: true}
          - {runner: macos-latest, artifact: wheels-macos-aarch64, python: "3.10", stim: true}
          - {runner: macos-latest, artifact: wheels-macos-aarch64, python: "3.14", stim: true}
          - {runner: ubuntu-latest, artifact: wheels-sdist, python: "3.14", stim: true}
    steps:
      # Only the tests: the installed package must come from the artifact.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: tests
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.platform.python }}
          architecture: ${{ matrix.platform.runner == 'windows-11-arm' && 'arm64' || '' }}
      - uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.platform.artifact }}
          path: dist
      - name: Install relay-bp from the artifact
        run: |
          if [ "${{ matrix.platform.artifact }}" = wheels-sdist ]; then
            python -m pip install maturin
            python -m pip install --no-index --no-deps --no-build-isolation --no-binary relay-bp --find-links dist relay-bp
          else
            python -m pip install --no-index --no-deps --only-binary relay-bp --find-links dist relay-bp
          fi
          # The old numpy versions that beliefmatching 0.2 needs have no wheel
          # for Python 3.14.
          if [ "${{ matrix.platform.stim }}" = true ]; then
            python -m pip install --only-binary numpy,scipy "relay-bp[stim]" pytest
          else
            python -m pip install --only-binary numpy,scipy relay-bp pytest
          fi
      # conftest.py skips every test when relay_bp does not import.
      - name: Import relay_bp
        run: python -c "import relay_bp; print(relay_bp.__file__)"
      - name: Run tests
        run: |
          if [ "${{ matrix.platform.stim }}" = true ]; then
            python -m pytest tests
          else
            python -m pytest tests --ignore=tests/stim
          fi

  # JavaScript actions do not run in Alpine containers on ARM runners, so the tests run in a
  # container started from the runner. numpy and scipy have musllinux wheels for aarch64 from
  # Python 3.10 on, and stim has none.
  test-musllinux:
    name: Test wheels-musllinux-${{ matrix.platform.target }} (Python ${{ matrix.python }})
    needs: [musllinux]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {runner: ubuntu-22.04, target: x86_64}
          - {runner: ubuntu-22.04-arm, target: aarch64}
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: tests
      - uses: actions/download-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist
      - name: Run tests
        run: |
          docker run --rm -v "$PWD:/io" -w /io python:${{ matrix.python }}-alpine sh -euc '
            python -m pip install --root-user-action ignore --no-index --no-deps --only-binary relay-bp --find-links dist relay-bp
            python -m pip install --root-user-action ignore --only-binary numpy,scipy relay-bp pytest
            python -c "import relay_bp; print(relay_bp.__file__)"
            python -m pytest -p no:cacheprovider tests --ignore=tests/stim
          '

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, windows, macos, sdist, test, test-musllinux]
    permissions:
      # Used to sign the artifact attestation
      id-token: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v6
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'wheels-*/*'

  # Publishing runs in the pypi environment, which requires approval by a reviewer. The trusted
  # publisher on PyPI is restricted to this environment.
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [release]
    environment:
      name: pypi
      url: https://pypi.org/project/relay-bp/
    permissions:
      # Used for trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always 'wheels-*/*'
